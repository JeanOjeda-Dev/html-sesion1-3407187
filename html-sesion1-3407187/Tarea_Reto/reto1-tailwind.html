<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Replica exacta</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="p-6">

  <div class="relative w-[500px] h-[300px] bg-[#c5e1a5] p-8">

    <div class="relative w-full h-full">

      <div class="absolute left-0 top-0 w-[8px] h-full bg-[#1f4f78]"></div>
      <div class="absolute bottom-0 left-0 w-full h-[2px] bg-[#22a8cc]"></div>
      <div class="absolute top-0 left-[10px] right-[10px] h-[2px] bg-[#bb9202]"></div>
      <div class="absolute top-[4px] left-[10px] right-[10px] h-[2px] bg-[#bb9202]"></div>
      <div class="absolute top-0 right-0 w-[6px] h-[20px] bg-[#70319e]"></div>
      <div class="absolute right-0 top-[24px] bottom-0 border-r-[6px] border-dashed border-[#70319e]"></div>

    </div>

  </div>

</body>
</html>
