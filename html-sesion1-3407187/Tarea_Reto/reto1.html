<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .caja-grande {
            display: block;
            width: 460px;
            height: 300px;
            background-color: #c5e1a5; 
            padding: 30px;
        }

        .caja {
            width: 400px;
            height: 250px;
            padding: 20px;
            background-color: #c5e1a5; 
            border-top: 6px double #bb9202;
            border-right: 8px dashed #70319e;
            border-bottom: 2px solid #22a8cc;
            border-left: 10px solid #1f4f78;
        }
    </style>
</head>
<body>
    <div class="caja-grande">
        <div class="caja"></div>
    </div>
</body>
</html>
