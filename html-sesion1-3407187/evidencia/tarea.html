<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>

        @font-face{
            font-family: "Inter";
            src: url('inter/Inter.ttf') format('truetype');
            font-style: normal;
            font-weight: 400;
            font-display: swap;

       }
       body{
        font-family: 'Inter', sans-serif;
       }
    *{margin: 0;
    padding: 0;}

    .card{
            display:block;
            width: 300px;
            height: 430px;
            background-color: #fda656;
            margin: 50px auto;
            border-radius: 15px;
        }
        .card__image{
            display: block;
            width: 280px;
            height: 165px;
            border-radius: 20px 20px 0 0;
            padding-top: 10px;
            padding-left: 10px;
            padding-right: 10px;
            object-fit: cover;
            margin-left: auto;
            margin-right: auto;
        }

        .card__company{
            display: block;
            width: 300px;
            height: 260px;
            background-color: #404042;
            border-radius: 15px 15px 15px 15px ;
            }

        .card__profesion{
            text-align: center;
            color: #c9b167;
            font-size: 15px;
            padding-top: 30px;


        }
        .card__Informacion{
            text-align: center;
            color: white;
            font-size: 15px;
            padding-top: 20px;
            padding-left: 50px;
            padding-right: 50px;
            
        }
        .card__boton{
            display: block;
            width: 80px;
            height: 40px;
            background-color: #fda656;
            border-radius: 5px;
            margin-top: 40px;
            margin-left: auto;
            margin-right: auto;
        

        }
        .card__boton--p {
            text-align: center;
            color: white;
            font-size: 15px;
            padding: 10px;


        }
</style>



</head>

<body>

    <div class="card">
        <img class="card__image" src="perfil.jpeg" alt="">
        <div class="card__company">
            <p class="card__profesion"> 
                Samuel Techton
            </p>
            <p class="card__Informacion"> 
                Software engineer with a knack for problem-solving, I thrive on coding challenges and crafting elegant solutions.
            </p>
            <div class="card__boton">
                <p class="card__boton--p">Follow</p>
            </div>
        </div>

    </div>
    
</body>
</html>
